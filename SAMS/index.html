<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: data: https://*.supabase.co; connect-src 'self' ws: wss: https://*.supabase.co http://127.0.0.1:8000 http://localhost:8000; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; base-uri 'self'; form-action 'self'" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>EAMS — Enterprise Asset Management System | Metahara Sugar Factory</title>
    <meta name="description" content="EAMS centralizes asset lifecycle management for Metahara Sugar Factory (መተሐራ ስኳር ፋብሪካ) — QR-enabled tracking, house/property allocation, RBAC workflows, and audit-ready reporting." />
    <meta name="keywords" content="enterprise asset management system, EAMS, Metahara Sugar Factory, QR asset tracking, property allocation, inventory management, audit reporting" />
    <meta name="author" content="IT Department, Metahara Sugar Factory" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#1F7A34" />

    <!-- Internal-facing enterprise app: no canonical/OG social links -->
    <meta property="og:title" content="EAMS — Enterprise Asset Management System" />
    <meta property="og:description" content="Internal asset & property management platform for Metahara Sugar Factory." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EAMS" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="icon" type="image/png" href="/favicon.png" sizes="any" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.png" />
  </head>

  <body>
    <style>
      #preloader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;background:hsl(var(--background));z-index:9999;transition:opacity .25s ease,visibility .25s linear}
      #preloader .wrap{position:relative;width:120px;height:120px}
      #preloader .wrap img{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:80px;height:80px;border-radius:50%;object-fit:cover;z-index:1;box-shadow:0 4px 24px rgba(0,0,0,0.18)}
      #preloader .ring{position:absolute;inset:0;animation:preloader-spin 1.6s linear infinite}
      #preloader .ring i{position:absolute;left:50%;top:50%;width:2.5px;height:14px;margin:-7px 0 0 -1.25px;border-radius:2px;background:hsl(var(--primary));opacity:0}
      #preloader .ring i:nth-child(1){opacity:1}#preloader .ring i:nth-child(2){opacity:.87}#preloader .ring i:nth-child(3){opacity:.74}#preloader .ring i:nth-child(4){opacity:.61}#preloader .ring i:nth-child(5){opacity:.48}#preloader .ring i:nth-child(6){opacity:.35}#preloader .ring i:nth-child(7){opacity:.22}#preloader .ring i:nth-child(8){opacity:.10}
      #preloader.preloader-hide{opacity:0;visibility:hidden}
      @keyframes preloader-spin{to{transform:rotate(360deg)}}
    </style>
    <script type="module" src="/src/theme-init.ts"></script>
    <div id="preloader" aria-hidden="true">
      <div class="wrap">
        <img src="/msf_logo.jpg" alt="MSF" />
        <div class="ring">
          <i style="transform:rotate(0deg) translateY(-52px)"></i>
          <i style="transform:rotate(45deg) translateY(-52px)"></i>
          <i style="transform:rotate(90deg) translateY(-52px)"></i>
          <i style="transform:rotate(135deg) translateY(-52px)"></i>
          <i style="transform:rotate(180deg) translateY(-52px)"></i>
          <i style="transform:rotate(225deg) translateY(-52px)"></i>
          <i style="transform:rotate(270deg) translateY(-52px)"></i>
          <i style="transform:rotate(315deg) translateY(-52px)"></i>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
