<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>EAMS — Enterprise Asset Management System | Metahara Sugar Factory</title>
    <meta name="description" content="EAMS centralizes asset lifecycle management for Metahara Sugar Factory (መተሐራ ስኳር ፋብሪካ) — QR-enabled tracking, house/property allocation, RBAC workflows, and audit-ready reporting." />
    <meta name="keywords" content="enterprise asset management system, EAMS, Metahara Sugar Factory, QR asset tracking, property allocation, inventory management, audit reporting" />

    <!-- Internal-facing enterprise app: no canonical/OG social links -->
    <meta property="og:title" content="EAMS — Enterprise Asset Management System" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="icon" type="image/png" href="/favicon.png" sizes="any" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.png" />
  </head>

  <body>
    <style>
      #preloader {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #0f172a; /* Deep slate dark background */
        z-index: 9999;
        transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s linear;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        overflow: hidden;
      }
      
      /* Subtle animated ambient background gradients */
      #preloader::before, #preloader::after {
        content: ""; position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.15; z-index: 0;
        animation: pulse-bg 8s infinite alternate ease-in-out;
      }
      #preloader::before { top: -10%; left: -10%; width: 50vw; height: 50vw; background: hsl(142.1 76.2% 50%); }
      #preloader::after { bottom: -10%; right: -10%; width: 40vw; height: 40vw; background: hsl(215 100% 50%); animation-delay: -4s; }
      
      @keyframes pulse-bg { 0% { transform: scale(1) translate(0, 0); } 100% { transform: scale(1.2) translate(5%, 5%); } }
      
      #preloader .content-wrapper {
        position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center;
        background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.05); padding: 3rem 4rem; border-radius: 2rem;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }
      
      #preloader .brand { margin-bottom: 3rem; position: relative; }
      #preloader img { 
        width: 110px; height: 110px; border-radius: 25%; object-fit: cover;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255,255,255,0.1);
        animation: float 6s ease-in-out infinite;
      }
      
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      
      #preloader .progress-container {
        width: 360px; height: 6px; background: rgba(255,255,255,0.08);
        border-radius: 99px; overflow: hidden; position: relative;
        box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);
      }
      
      #preloader .progress-bar {
        position: absolute; top: 0; left: 0; bottom: 0; width: 0%;
        background: linear-gradient(90deg, hsl(142.1 76.2% 40%), hsl(142.1 76.2% 60%));
        border-radius: 99px;
        transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: 0 0 15px hsl(142.1 76.2% 50% / 0.5);
      }
      
      /* Glowing leading edge */
      #preloader .progress-bar::after {
        content: ""; position: absolute; top: 0; right: 0; bottom: 0; width: 20px;
        background: white; filter: blur(4px); opacity: 0.6;
      }
      
      #preloader .status-text {
        margin-top: 1.5rem; font-size: 0.8rem; font-weight: 600;
        color: rgba(255, 255, 255, 0.7);
        text-transform: uppercase; letter-spacing: 0.15em;
        display: flex; justify-content: space-between; width: 360px;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      }
      
      #preloader .status-text #preloader-percent {
        color: white; font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      
      #preloader.preloader-hide { opacity: 0; visibility: hidden; pointer-events: none; transform: scale(1.02); }
    </style>
    
    <script>
      window.loaderState = { percent: 0, text: 'Initializing...' };
      
      window.updateLoader = function(percent, text) {
        window.loaderState.percent = Math.min(percent, 100);
        if (text) window.loaderState.text = text;
        
        var bar = document.getElementById('preloader-bar');
        var status = document.getElementById('preloader-status');
        var pct = document.getElementById('preloader-percent');
        
        if (bar) bar.style.width = window.loaderState.percent + '%';
        if (status) status.innerText = window.loaderState.text;
        if (pct) pct.innerText = Math.round(window.loaderState.percent) + '%';
      };

      // Use PerformanceObserver for true network-based loading progress
      try {
        window.loaderState.loaded = 0;
        window.loaderState.total = 15; // baseline minimum expected resources
        
        var observer = new PerformanceObserver(function(list) {
          var entries = list.getEntries();
          window.loaderState.loaded += entries.length;
          
          // Dynamically count resources in DOM to calculate an accurate total
          var domResources = document.querySelectorAll('script[src], link[rel="stylesheet"], link[rel="modulepreload"], img[src]').length;
          window.loaderState.total = Math.max(window.loaderState.total, domResources + window.loaderState.loaded); 
          
          // Calculate true percentage based on network resources loaded
          var calcPct = (window.loaderState.loaded / window.loaderState.total) * 95; 
          
          if (calcPct > window.loaderState.percent) {
            var msg = 'Loading Dashboard...';
            if (calcPct > 15) msg = 'Syncing Assets & Properties...';
            if (calcPct > 35) msg = 'Initializing Residential Hub...';
            if (calcPct > 55) msg = 'Loading QR Codes & Approvals...';
            if (calcPct > 75) msg = 'Fetching Tickets & Reports...';
            if (calcPct > 90) msg = 'Securing User Accounts...';
            
            window.updateLoader(calcPct, msg);
          }
        });
        
        observer.observe({ entryTypes: ['resource'] });
        
        // Also track main document milestones
        document.addEventListener('DOMContentLoaded', function() {
          if (window.loaderState.percent < 30) window.updateLoader(30, 'Syncing Assets & Properties...');
        });
        window.addEventListener('load', function() {
          if (window.loaderState.percent < 95) window.updateLoader(95, 'Preparing Dashboard...');
          observer.disconnect();
        });
      } catch (e) {
        // Fallback for older browsers without PerformanceObserver
        document.addEventListener('DOMContentLoaded', function() { window.updateLoader(40, 'Initializing Residential Hub...'); });
        window.addEventListener('load', function() { window.updateLoader(85, 'Fetching Tickets & Reports...'); });
      }
    </script>
    <script type="module" src="/src/theme-init.ts"></script>
    
    <div id="preloader" aria-hidden="true">
      <div class="content-wrapper">
        <div class="brand">
          <img src="/msf_logo.jpg" alt="MSF" />
        </div>
        <div class="progress-container">
          <div id="preloader-bar" class="progress-bar"></div>
        </div>
        <div class="status-text">
          <span id="preloader-status">Initializing...</span>
          <span id="preloader-percent">0%</span>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
