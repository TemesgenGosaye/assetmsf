<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metahara Sugar Factory — Enterprise Asset & Housing System</title>
  <meta name="description" content="EAMS centralizes asset lifecycle management for Metahara Sugar Factory (መተሐራ ስኳር ፋብሪካ) — QR-enabled tracking, house/property allocation, RBAC workflows, and audit-ready reporting." />
  <meta name="keywords" content="enterprise asset management system, EAMS, Metahara Sugar Factory, QR asset tracking, property allocation, inventory management, audit reporting" />
  <meta name="author" content="IT Department, Metahara Sugar Factory" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#cc7c5e" />

  <meta property="og:title" content="Metahara Sugar Factory EAMS" />
  <meta property="og:description" content="Internal asset & property management platform for Metahara Sugar Factory." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="EAMS" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&display=swap" rel="stylesheet" />

  <link rel="icon" type="image/png" href="/favicon.png" sizes="any" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <link rel="shortcut icon" href="/favicon.png" />

  <style>
    /* ====== Enterprise Launch Preloader — Default White ====== */
    :root {
      --loader-bg: #ffffff;
      --loader-card: rgba(255, 255, 255, 0.95);
      --loader-border: rgba(220, 226, 235, 0.9);
      --loader-text: hsl(225 25% 15%);
      --loader-muted: hsl(215 16% 45%);
      --loader-faint: hsl(215 16% 60%);
      --loader-track: rgba(230, 235, 245, 0.95);
      --loader-shadow: rgba(0, 0, 0, 0.08);
      --brand-primary: hsl(var(--primary, 16 52% 58%));
      --brand-accent: hsl(var(--accent, 16 52% 94%));
      --brand-glow: hsla(16, 52%, 58%, 0.22);
    }

    :root[data-loader-theme="dark"] {
      --loader-bg: hsl(220 20% 10%);
      --loader-card: hsla(220, 20%, 14%, 0.88);
      --loader-border: hsla(0, 0%, 100%, 0.15);
      --loader-text: #ffffff;
      --loader-muted: rgba(255, 255, 255, 0.75);
      --loader-faint: rgba(255, 255, 255, 0.45);
      --loader-track: rgba(0, 0, 0, 0.45);
      --loader-shadow: rgba(0, 0, 0, 0.65);
      --brand-primary: hsl(var(--primary, 16 52% 58%));
      --brand-accent: hsl(var(--accent, 16 52% 94%));
      --brand-glow: hsla(16, 52%, 58%, 0.45);
    }

    #preloader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background:
        radial-gradient(120vmax 60vmax at 50% -10%, var(--brand-glow), transparent 70%),
        radial-gradient(90vmax 60vmax at 100% 100%, hsla(217, 91%, 60%, 0.08), transparent 60%),
        radial-gradient(var(--brand-primary) 1px, transparent 1.6px) 0 0 / 28px 28px,
        var(--loader-bg);
      z-index: 99999;
      font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
      overflow: hidden;
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.5s linear, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #preloader.preloader-hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: scale(1.02);
    }

    /* Ambient background glows */
    #preloader::before, #preloader::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(110px);
      opacity: 0.25;
      z-index: 0;
      animation: preloader-pulse 10s infinite alternate ease-in-out;
    }
    #preloader::before {
      top: -15%; left: -10%;
      width: 50vmin; height: 50vmin;
      background: var(--brand-primary);
    }
    #preloader::after {
      bottom: -15%; right: -10%;
      width: 45vmin; height: 45vmin;
      background: hsl(217 91% 60%);
      animation-delay: -5s;
    }
    @keyframes preloader-pulse {
      0% { transform: scale(1) translate(0, 0); }
      100% { transform: scale(1.2) translate(4%, 4%); }
    }

    /* Clean Cardless Layout — content floats directly on background */
    .loader-card {
      position: relative;
      z-index: 1;
      width: min(92vw, 480px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      padding: clamp(2rem, 5vw, 3.5rem) clamp(2rem, 6vw, 4rem);
      background: transparent;
      border: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      box-shadow: none;
    }

    /* === Circular progress ring & logo === */
    .loader-orb {
      position: relative;
      width: 144px;
      height: 144px;
    }
    .loader-ring {
      width: 100%;
      height: 100%;
      display: block;
    }
    .ring-track, .ring-fill {
      fill: none;
      stroke-width: 7;
    }
    .ring-track {
      stroke: var(--loader-track);
    }
    .ring-fill {
      stroke-linecap: round;
      stroke-dasharray: 339.292;
      stroke-dashoffset: 339.292;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
      transition: stroke-dashoffset 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      filter: drop-shadow(0 0 10px var(--brand-primary));
    }
    .loader-logo-wrap {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 65%; height: 65%;
      border-radius: 50%;
      padding: 4px;
      background: transparent;
      border: none;
      box-shadow: none;
      animation: loader-float 4s ease-in-out infinite;
    }
    .loader-logo {
      width: 100%; height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }
    @keyframes loader-float {
      0%, 100% { transform: translate(-50%, -50%); }
      50% { transform: translate(-50%, calc(-50% - 6px)); }
    }

    .loader-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      text-align: center;
    }
    .loader-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.25rem 0.9rem;
      border-radius: 9999px;
      background: hsla(16, 52%, 58%, 0.12);
      border: 1px solid hsla(16, 52%, 58%, 0.3);
      color: var(--brand-primary);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .loader-title {
      color: var(--loader-text);
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .loader-sub {
      color: var(--loader-muted);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .loader-percent {
      color: var(--loader-text);
      font-weight: 900;
      font-size: 3rem;
      line-height: 1;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 20px var(--brand-glow);
    }
    .loader-percent small {
      font-size: 0.5em;
      color: var(--loader-muted);
      font-weight: 700;
      margin-left: 0.1rem;
    }

    /* === Classic Windows Installer Progress Bar === */
    .loader-progress {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .loader-progress-track {
      position: relative;
      width: 100%;
      height: 22px;
      background: var(--loader-track);
      border-radius: 3px;
      overflow: hidden;
      border-top: 1px solid var(--loader-shadow);
      border-left: 1px solid var(--loader-shadow);
      border-bottom: 1px solid rgba(255,255,255,0.8);
      border-right: 1px solid rgba(255,255,255,0.8);
      box-shadow: inset 0 1px 4px var(--loader-shadow);
    }

    .loader-progress-bar {
      position: relative;
      height: 100%;
      width: 0%;
      border-radius: 2px;
      background:
        repeating-linear-gradient(
          90deg,
          hsl(var(--primary, 16 52% 58%)) 0px,
          hsl(var(--primary, 16 52% 58%)) 8px,
          hsl(var(--primary, 16 52% 58%) / 0.75) 8px,
          hsl(var(--primary, 16 52% 58%) / 0.75) 10px
        );
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.35);
      transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Top highlight shine like classic Windows bar */
    .loader-progress-bar::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 45%;
      border-radius: 2px 2px 0 0;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.45) 0%,
        rgba(255, 255, 255, 0.08) 100%
      );
    }

    /* Shimmer sweep animation */
    .loader-progress-bar::after {
      content: "";
      position: absolute; top: 0; bottom: 0; width: 60px;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.35) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      animation: loader-shimmer 2s linear infinite;
    }
    @keyframes loader-shimmer {
      from { left: -60px; }
      to { left: calc(100% + 60px); }
    }

    .loader-status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0 0.1rem;
    }

    .loader-status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--loader-muted);
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    .loader-dots {
      display: inline-flex; gap: 3.5px;
    }
    .loader-dots i {
      width: 4.5px; height: 4.5px;
      border-radius: 50%;
      background: var(--brand-primary);
      animation: loader-blink 1.2s infinite;
    }
    .loader-dots i:nth-child(2) { animation-delay: 0.2s; }
    .loader-dots i:nth-child(3) { animation-delay: 0.4s; }
    @keyframes loader-blink {
      0%, 60%, 100% { opacity: 0.3; }
      30% { opacity: 1; }
    }

    .loader-amharic {
      width: 100%;
      text-align: center;
      color: var(--loader-muted);
      font-size: 0.80rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      padding-top: 0.25rem;
    }

    .loader-footer {
      position: relative; z-index: 1;
      color: var(--loader-faint);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-align: center;
    }

    @media (prefers-reduced-motion: reduce) {
      #preloader::before, #preloader::after, .loader-logo-wrap, .loader-progress-bar::before, .loader-dots i {
        animation: none;
      }
    }
  </style>

  <script>
    (function () {
      'use strict';

      var STAGES = [
        [5,   'Starting Enterprise Application...'],
        [20,  'Loading Core UI Modules...'],
        [38,  'Syncing Assets & Property Registry...'],
        [55,  'Preparing Housing & Employee Queue...'],
        [72,  'Initializing QR & Audit Trackers...'],
        [88,  'Fetching System Metrics & Security...'],
        [98,  'Finalizing Secure Session...']
      ];

      var RING_C = 339.292;

      function stageLabel(p) {
        var label = STAGES[0][1];
        for (var i = 0; i < STAGES.length; i++) {
          if (p >= STAGES[i][0]) label = STAGES[i][1];
        }
        return label;
      }

      function apply(p, text) {
        var ring = document.getElementById('loader-ring');
        var bar = document.getElementById('preloader-bar');
        var status = document.getElementById('preloader-status');
        var pct = document.getElementById('preloader-percent');
        if (ring) ring.style.strokeDashoffset = String(RING_C * (1 - p / 100));
        if (bar) bar.style.width = p + '%';
        if (status) status.textContent = text || stageLabel(p);
        if (pct) pct.textContent = Math.round(p);
      }

      window.loaderState = { percent: 0, text: STAGES[0][1], target: 0 };

      window.updateLoader = function (percent, text) {
        var p = Math.max(0, Math.min(percent, 100));
        window.loaderState.target = p;
        window.loaderState.percent = p;
        if (text) window.loaderState.text = text;
        apply(p, text || stageLabel(p));
      };

      var networkPct = 0;
      var loadStart = performance.now();
      var displayed = 0;

      function tick(now) {
        if (window.loaderState.target >= 100) {
          displayed = 100;
          apply(100, window.loaderState.text || 'Connected');
          return;
        }
        var elapsed = now - loadStart;
        var timePct = Math.min(95, (elapsed / 6000) * 95);
        var target = Math.max(window.loaderState.target, networkPct, timePct);
        displayed += (target - displayed) * 0.18;
        if (Math.abs(target - displayed) < 0.4) displayed = target;
        apply(displayed, null);
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);

      try {
        window.loaderState.loaded = 0;
        window.loaderState.total = 12;
        var observer = new PerformanceObserver(function (list) {
          window.loaderState.loaded += list.getEntries().length;
          var domResources = document.querySelectorAll('script[src], link[rel="stylesheet"], link[rel="modulepreload"]').length;
          window.loaderState.total = Math.max(window.loaderState.total, domResources + window.loaderState.loaded);
          var calc = Math.min(95, (window.loaderState.loaded / window.loaderState.total) * 95);
          if (calc > networkPct) networkPct = calc;
        });
        observer.observe({ entryTypes: ['resource'] });
        document.addEventListener('DOMContentLoaded', function () {
          networkPct = Math.max(networkPct, 30);
        });
        window.addEventListener('load', function () {
          networkPct = 95;
          try { observer.disconnect(); } catch (e) {}
        });
      } catch (e) {
        document.addEventListener('DOMContentLoaded', function () {
          networkPct = Math.max(networkPct, 35);
        });
        window.addEventListener('load', function () { networkPct = 95; });
      }
    })();
  </script>
</head>
<body>
  <script type="module" src="/src/theme-init.ts"></script>

  <div id="preloader" aria-hidden="true">
    <div class="loader-card">
      <div class="loader-orb">
        <svg class="loader-ring" viewBox="0 0 120 120" aria-hidden="true">
          <defs>
            <linearGradient id="loader-grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="hsl(var(--primary, 16 52% 58%))" />
              <stop offset="100%" stop-color="hsl(var(--primary, 16 52% 58%))" stop-opacity="0.4" />
            </linearGradient>
          </defs>
          <circle class="ring-track" cx="60" cy="60" r="54" />
          <circle class="ring-fill" id="loader-ring" cx="60" cy="60" r="54" stroke="url(#loader-grad)" />
        </svg>
        <div class="loader-logo-wrap">
          <img class="loader-logo" src="/msf_logo.jpg" alt="Metehara Sugar Factory" />
        </div>
      </div>

      <div class="loader-brand">
        <span class="loader-badge">Enterprise Asset System</span>
        <div class="loader-title">የመተሐራ ስኳር ፋብሪካ ቋሚ ንብረት አስተዳደር እና የቤት ምደባ ሲስተም</div>
        <div class="loader-sub">መተሐራ ስኳር ፋብሪካ &middot; Asset and House Platform</div>
      </div>

      <div class="loader-percent"><span id="preloader-percent">0</span><small>%</small></div>

      <div class="loader-progress">
        <div class="loader-progress-track">
          <div id="preloader-bar" class="loader-progress-bar"></div>
        </div>
        <div class="loader-status-row">
          <div class="loader-status">
            <span id="preloader-status">Starting Enterprise Application...</span>
            <span class="loader-dots" aria-hidden="true"><i></i><i></i><i></i></span>
          </div>
        </div>
        <div class="loader-amharic"></div>
      </div>
    </div>

    <div class="loader-footer">Powered By Temesgen G. &middot; MSF IT Division</div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
